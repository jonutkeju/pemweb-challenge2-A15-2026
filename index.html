<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> // ini biar tampilan di laptop dan hp lebih pas 
    <title>To-Do List</title>// judul yang nanti ada di tab browser 
    <link rel="stylesheet" href="style.css"> // nyambungin html ke css 
</head>
<body> // tempat semua isinya 
    <main class="todo-container">
        <h1>To-Do List</h1> judul besar di halaman 

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter a task"> tempat ngetik tugas baru
            <button id="addButton">Add</button> tombol pencet buat nambahin tugas baru
        </div>

        <div class="filters">
            <button id="allButton" class="active">All</button>
            <button id="activeButton">Active</button>
            <button id="completedButton">Completed</button>
        </div>

        <ul id="taskList"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
